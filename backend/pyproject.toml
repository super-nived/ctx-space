[project]
name = "ctx-space-backend"
version = "0.1.0"
description = "Context Space (CTX-SPACE) AG-UI agent backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
