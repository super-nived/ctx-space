# Test on alternate ports so local dev (8000/8090/5173) keeps running alongside.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
services:
  pocketbase:
    ports:
      - target: 8090
        published: "8091"
        mode: ingress
  backend:
    ports:
      - target: 8000
        published: "8001"
        mode: ingress
    environment:
      ALLOWED_ORIGINS: "http://localhost:3001"
  frontend:
    ports:
      - target: 3000
        published: "3001"
        mode: ingress
    environment:
      AGENT_URL: http://backend:8000/
